name: Deploy (reusable)

# Shared deployment logic. Staging (lr / lr-backup) and production (master)
# deploy the same way, so the steps live here once and are parameterised by
# environment. Callers: cicd-staging.yml, cicd-production.yml.
on:
  workflow_call:
    inputs:
      branch:
        description: Branch being deployed
        required: true
        type: string
      environment:
        description: Target environment (staging or production)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Attaches this job to a GitHub Environment, so protection rules and
    # environment-scoped secrets apply per target.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Show what we are deploying
        run: |
          echo "environment: ${{ inputs.environment }}"
          echo "branch:      ${{ inputs.branch }}"
          echo "sha:         $(git rev-parse --short HEAD)"
          echo "trigger:     ${{ github.event_name }}"

      - name: Deploy
        run: echo "TODO - real deploy steps for ${{ inputs.environment }}"
