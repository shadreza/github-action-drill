name: CI/CD (production)

# master is production. No toggle — every push deploys. Add required
# reviewers to the `production` environment in repo settings if you want
# a human gate before it goes live.
on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      branch: master
      environment: production
    secrets: inherit
